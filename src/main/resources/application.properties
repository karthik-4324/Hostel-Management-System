# Server
server.port=5000
server.servlet.context-path=/api

# MongoDB (local)
spring.data.mongodb.uri=mongodb://localhost:27017/management_dev
spring.data.mongodb.auto-index-creation=true

# Secrets and personal settings (jwt.secret, mail credentials) are in this file, which is not committed
spring.config.import=optional:classpath:application-local.properties

# JWT
jwt.expiration=86400000

# Email (username and password come from application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Address used in password reset links
app.frontend-url=http://localhost:3000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging (DEBUG on web/security prints response bodies, including tokens, so keep them at INFO)
logging.level.com.hostel=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# CORS Configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true